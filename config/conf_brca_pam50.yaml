experiment:
  project_name: brca_pam50
  annotation_file: annotations_brca_pam50.csv
  balancing: slide
  class_weighting: True
  split_technique: k-fold
  k: 5
  val_fraction: 0.1
  best_epoch_based_on: val_loss
  epochs: 20
  batch_size: 16
  bag_size: 512
  encoder_layers: 1
  z_dim: 256
  dropout_p: 0.1
  num_workers: 8
  aggregation_level: slide
  task: classification
  mode: benchmark
  custom_metrics: []
  report: True
  skip_extracted: False
  skip_feature_extraction: False
  mixed_precision: True
  save_heatmaps_test: False

  experiment_label: brca_pam50_run

  qc:
    - GaussianV2

  qc_filters:
    grayspace_threshold: 0.05
    grayspace_fraction: 0.6
    whitespace_threshold: 230
    whitespace_fraction: 1.0

  evaluation:
    - balanced_accuracy
    - weighted_f1

  visualization:
    - confusion_matrix
    - roc_curve
    - precision_recall_curve
    - top_tiles

datasets:
  - name: tcga
    slide_path: /media/jorge/BigTwo/cluster/datos/TCGA-BRCA
    tfrecord_path: experiments/brca_pam50/tfrecords/tcga
    tile_path: experiments/brca_pam50/tiles/tcga
    used_for: training

  - name: cptac
    slide_path: /media/jorge/BigOne/medicina/patologia_digital/datos/BRCA
    tfrecord_path: experiments/brca_pam50/tfrecords/cptac
    tile_path: experiments/brca_pam50/tiles/cptac
    used_for: testing

benchmark_parameters:
  tile_px:
    - 256
  tile_um:
    - 128          # 128 µm ≡ 20x para slides 0.25 MPP (40x)
  normalization:
    - macenko
  feature_extraction:
    - Virchow2
  mil:
    - attention_mil
  loss:
    - CrossEntropyLoss
  activation_function:
    - ReLU
  optimizer:
    - Adam

weights_dir: ./pretrained_weights
hf_key:   # Sustituir por token HuggingFace para modelos gated (Virchow2, UNI, etc.)
