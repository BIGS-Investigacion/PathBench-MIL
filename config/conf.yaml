experiment:
  project_name: CPTAC_COAD
  annotation_file: ./config/annotations/annotation_file.csv
  balancing: category
  class_weighting: True
  split_technique: k-fold
  k: 3
  val_fraction: 0.1
  best_epoch_based_on: val_loss
  epochs: 5
  batch_size: 32
  bag_size: 512
  encoder_layers: 1
  z_dim: 256
  dropout_p: 0.1
  num_workers: 4
  aggregation_level: slide
  task: classification
  mode: benchmark
  custom_metrics: []
  report: False
  save_heatmaps_val: True

  multiprocessing_context: fork
  persistent_workers: True
  pin_memory: True
  mixed_precision: True

  experiment_label: cptac_coad_binary_classification_msi_h

  qc:
    - GaussianV2
    - Otsu-CLAHE

  qc_filters:
    grayspace_threshold : 0.05
    grayspace_fraction: 0.6
    whitespace_threshold: 230
    whitespace_fraction: 1.0

  evaluation:
    - balanced_accuracy
    - auc

  visualization:
    - confusion_matrix
    - roc_curve
    - precision_recall_curve
    - top_tiles

datasets:
  - name: train 
    slide_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/COAD
    tfrecord_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/tfrecords
    tile_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/COAD/tiles
    used_for: training

  - name: test
    slide_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/COAD                          
    tfrecord_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/tfrecords 
    tile_path: /home/PARADIS/colon/wsi/CPTAC-COAD_v1/COAD/tiles
    used_for: testing

benchmark_parameters:
  tile_px:
    - 256
  tile_um:
    - 10x
  normalization:
    - macenko

  feature_extraction:
    - resnet50_imagenet

  mil:
    - attention_mil
  
weights_dir: ./pretrained_weights
hf_key: None
